[project]
name = "quant-regimes"
version = "0.1.0"
description = "Regime-aware portfolio on GCP"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "numpy>=1.26",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
  "hmmlearn>=0.3",
  "arch>=7.0",
  "google-cloud-bigquery[pandas]>=3.25",
  "google-cloud-storage>=2.17",
  "google-cloud-secret-manager>=2.20",
  "pandas-gbq>=0.23",
  "db-dtypes>=1.2",
  "requests>=2.32",
  "yfinance>=0.2.43",
  "gspread>=6.1",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff>=0.6",
  "pre-commit",
  "nbstripout",
  "sqlfluff>=3.0",
  "ipykernel",
  "jupyterlab",
  "matplotlib",
  "seaborn",
  "plotly",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "ingestion"]
